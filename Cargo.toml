[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { git = "https://github.com/Vaxelium/common", branch = "main" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
skrifa = "0.49"
tiny-skia = "0.12"
unicode-normalization = "0.1"
